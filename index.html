  <body>
    <div id="root"></div>

    <!--
      Static HTML copies of the forms so Netlify can detect them at build time.
      The real (React) forms submit to "/" with the same form-name and field names.
      Keep field names in sync with src/components/RSVPSection.tsx and GuestbookSection.tsx.
    -->
    <form name="rsvp" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rsvp" />
      <input name="bot-field" />
      <input type="text" name="nama" />
      <input type="text" name="kehadiran" />
      <input type="number" name="jumlah" />
      <textarea name="ucapan"></textarea>
    </form>
    <form name="guestbook" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="guestbook" />
      <input name="bot-field" />
      <input type="text" name="nama" />
      <textarea name="ucapan"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
